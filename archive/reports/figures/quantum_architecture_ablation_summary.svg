<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="170 0 660 400">
  <rect width="820" height="400" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">
    <text x="390" y="48">BW_DOWN</text>
    <text x="545" y="48">BW_CRUISE</text>
    <text x="700" y="48">BW_UP</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end" fill="#111827">
    <text x="292" y="105">q4/d2 RY</text>
    <text x="292" y="180">q8/d2 RY</text>
    <text x="292" y="255">q8/d3 RY</text>
    <text x="292" y="330">q8/d2 RY+RZ</text>
  </g>

  <!-- 0% uses neutral grey, approximately 21% uses light blue, and 100% uses dark blue. -->
  <g stroke="#ffffff" stroke-width="3">
    <rect x="315" y="68" width="150" height="60" fill="#f3f4f6"/>
    <rect x="470" y="68" width="150" height="60" fill="#1d4ed8"/>
    <rect x="625" y="68" width="150" height="60" fill="#dbeafe"/>

    <rect x="315" y="143" width="150" height="60" fill="#1d4ed8"/>
    <rect x="470" y="143" width="150" height="60" fill="#1d4ed8"/>
    <rect x="625" y="143" width="150" height="60" fill="#dbeafe"/>

    <rect x="315" y="218" width="150" height="60" fill="#1d4ed8"/>
    <rect x="470" y="218" width="150" height="60" fill="#1d4ed8"/>
    <rect x="625" y="218" width="150" height="60" fill="#dbeafe"/>

    <rect x="315" y="293" width="150" height="60" fill="#1d4ed8"/>
    <rect x="470" y="293" width="150" height="60" fill="#1d4ed8"/>
    <rect x="625" y="293" width="150" height="60" fill="#dbeafe"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <text x="390" y="105" fill="#111827">0.00</text>
    <text x="545" y="105" fill="#ffffff">100.00</text>
    <text x="700" y="105" fill="#111827">21.45</text>

    <text x="390" y="180" fill="#ffffff">100.00</text>
    <text x="545" y="180" fill="#ffffff">100.00</text>
    <text x="700" y="180" fill="#111827">21.45</text>

    <text x="390" y="255" fill="#ffffff">100.00</text>
    <text x="545" y="255" fill="#ffffff">100.00</text>
    <text x="700" y="255" fill="#111827">20.72</text>

    <text x="390" y="330" fill="#ffffff">100.00</text>
    <text x="545" y="330" fill="#ffffff">100.00</text>
    <text x="700" y="330" fill="#111827">21.45</text>
  </g>

  <text x="545" y="384" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#4b5563">Cell values are accuracy percentages.</text>
</svg>
